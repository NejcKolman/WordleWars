<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="css/play.css" />
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  </head>

  <body>
    <div class="aboveKeyboard">
      <div class="aboveKeyboardLeft">player2</div>
      <div class="aboveKeyboardCenter">
        <div class="history">
          <table id="guesses"></table>
          <p id="warning"></p>
        </div>

        <table id="myGuess">
          <tr>
            <td class="blank" id="L1"></td>
            <td class="blank" id="L2"></td>
            <td class="blank" id="L3"></td>
            <td class="blank" id="L4"></td>
            <td class="blank" id="L5"></td>
          </tr>
        </table>
      </div>
      <div class="aboveKeyboardRight">player3</div>
    </div>
    <div class="keyboardArea">
      <div class="keyboardContainer"></div>
    </div>
  </body>

  <script>
    const playerName = location.href.split("?")[1].split("&")[0];
    const lobbyID = location.href.split("?")[1].split("&")[1];
    const ws = new WebSocket("ws://localhost:3000");

    ws.onopen = () => {
      console.log("Connected to server");
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(
          JSON.stringify({
            type: "JOIN_LOBBY",
            player: playerName,
            lobbyID: lobbyID,
          })
        );
      }
    };
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      console.log("Message from server:", msg);
      if (!msg.type) {
        if (msg[0].type == "myGuess") {
          const word = msg.at(-1).word;
          const evaluation = msg.at(-1).evaluation;
          const historyTable = document.getElementById("guesses");

          const row = document.createElement("tr");
          for (let i = 0; i < word.length; i++) {
            const letter = word[i];
            const color = evaluation[i];
            console.log(word);
            let cell = document.createElement("td");
            cell.textContent = letter;
            cell.classList.add("blank");
            console.log(color);
            if (color == "S") {
              cell.classList.add("siva");
            } else if (color == "R") {
              cell.classList.add("rumena");
            } else if (color == "Z") {
              cell.classList.add("zelena");
            }
            row.appendChild(cell);
            historyTable.appendChild(row);
          }
        }
      }
    };
    ws.onclose = () => {
      console.log("Disconnected from server");
    };

        ws.send(
          JSON.stringify({
            type: "GUESS",
            player: playerName,
            lobbyID: lobbyID,
            guessWord: guessWord,
          })
        );
      }
    }
  </script>
</html>
<script src="js/play.js" type="text/javascript"></script>
