<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="css/play.css" />
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  </head>

  <body>
    <button id="hideChatButton" class="hideChatButton" onclick="hideChat()">☰</button>
    <button id="hideLeaderboardButton" class="hideLeaderboardButton" onclick="hideLeaderboard()">🏆</button>
    <div class="aboveKeyboard">
      <div class="aboveKeyboardLeft">
        <div id="gameInfo" class="gameInfo"></div>
        <div id="chatBox" class="chatBox">
          <div id="outputChatBox" class="outputChatBox"></div>
          <input type="text" id="inputChatBox" class="inputChatBox" placeholder="Type a message" on />
        </div>
        <div id="gameButtons"></div>
      </div>
      <div class="aboveKeyboardCenter">
        <div class="history">
          <table id="guesses"></table>
          <p id="warning"></p>
        </div>

        <table id="myGuess">
          <tr>
            <td class="blank" id="L1"></td>
            <td class="blank" id="L2"></td>
            <td class="blank" id="L3"></td>
            <td class="blank" id="L4"></td>
            <td class="blank" id="L5"></td>
          </tr>
        </table>
      </div>
      <div class="aboveKeyboardRight"></div>
    </div>
    <div class="keyboardArea">
      <div class="keyboardContainer"></div>
    </div>
  </body>

  <script>
    const playerName = location.href.split("?")[1].split("&")[0];
    const lobbyID = location.href.split("?")[1].split("&")[1];
    const myNameDiv = document.createElement("div");
    myNameDiv.innerHTML = "My Nickname: " + playerName;
    const lobbyIDDiv = document.createElement("div");
    lobbyIDDiv.innerHTML = "Lobby ID: " + lobbyID;
    document.getElementById("gameInfo").appendChild(myNameDiv);
    document.getElementById("gameInfo").appendChild(lobbyIDDiv);

    //const protocol = location.protocol === "https:" ? "wss" : "ws";
    //const wsUrl = `${protocol}://${location.hostname}:3000`;
    //const ws = new WebSocket(wsUrl);
    const ws = new WebSocket("ws://localhost:3000");
    //const ws = new WebSocket("wss://wordlewars-production.up.railway.app");

    ws.onopen = () => {
      console.log("Connected to server");
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(
          JSON.stringify({
            type: "JOIN_LOBBY",
            player: playerName,
            lobbyID: lobbyID,
          }),
        );
      }
    };
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      console.log("Message from server:", msg);
      if (!msg.type) {
        if (msg[0].type == "myGuess") {
          const word = msg.at(-1).word;
          const evaluation = msg.at(-1).evaluation;
          const historyTable = document.getElementById("guesses");

          const row = document.createElement("tr");
          for (let i = 0; i < word.length; i++) {
            const letter = word[i];
            const color = evaluation[i];
            console.log(word);
            let cell = document.createElement("td");
            let key = document.getElementById("button" + letter);
            cell.textContent = letter;
            cell.classList.add("blank");
            console.log(color);

            if (color == "Z") {
              cell.classList.add("zelena");
              if (!key.classList.contains("correct")) {
                key.classList.add("correct");
              }
            } else if (color == "R") {
              cell.classList.add("rumena");
              if (!key.classList.contains("correct") & !key.classList.contains("partial")) {
                key.classList.add("partial");
              }
            } else if (color == "S") {
              cell.classList.add("siva");
              if (!key.classList.contains("correct") & !key.classList.contains("partial") & !key.classList.contains("wrong")) {
                key.classList.add("wrong");
              }
            }
            row.appendChild(cell);
            historyTable.appendChild(row);
          }
          if (evaluation == "ZZZZZ") {
            guessedCorrectly(msg.length);
          }
        }
      } else if (msg.type == "lobbyState") {
        const players = msg.players;
        console.log("update");
        updateLeaderboard(players);
      } else if (msg.type == "newGuess") {
        updateLeaderboard2(msg);
      } else if (msg.type == "playerLeft") {
        console.log("PL");
        removePlayer(msg);
      } else if (msg.type == "MESSAGE") {
        const message = msg.message;
        writeInChat(message);
      }
    };
    ws.onclose = () => {
      console.log("Disconnected from server");
    };
  </script>
</html>
<script src="js/play.js" type="text/javascript"></script>
